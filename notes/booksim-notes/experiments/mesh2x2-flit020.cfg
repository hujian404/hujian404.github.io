// Teaching smoke configuration: rate is flits per node per cycle.
topology = mesh;
k = 2;
n = 2;
routing_function = dor;
router = iq;
num_vcs = 4;
vc_buf_size = 4;
buffer_policy = private;
wait_for_tail_credit = 1;
vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;
routing_delay = 1;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
credit_delay = 1;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;
traffic = uniform;
packet_size = 4;
injection_rate_uses_flits = 1;
injection_rate = 0.20;
use_read_write = 0;
sim_type = latency;
warmup_periods = 2;
sample_period = 1000;
max_samples = 10;
sim_count = 1;
seed = 1;
