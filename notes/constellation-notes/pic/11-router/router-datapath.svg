<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img">
<title>Router：数据通路与资源控制</title>
<desc>实线：flit 数据；虚线：资源请求、选择或状态。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52657a"/></marker></defs>
<rect width="1040" height="440" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<text x="25" y="40" font-size="25" font-weight="700" fill="#16324f">Router：数据通路与资源控制</text>
<text x="25" y="70" font-size="15" fill="#52657a">实线：flit 数据；虚线：资源请求、选择或状态。</text>
<path d="M 320 130 L 380 130" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350.0" y="120" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">flit</text>
<path d="M 660 130 L 720 130" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="690.0" y="120" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">flit</text>
<path d="M 180 185 L 180 285" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="192" y="235.0" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">RC request</text>
<path d="M 320 320 L 380 320" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="350.0" y="310" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">候选</text>
<path d="M 660 320 L 720 320" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="690.0" y="310" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">绑定</text>
<path d="M 860 185 L 860 285" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="872" y="235.0" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">credit 状态</text>
<path d="M 860 285 L 860 235.0 L 445 235.0 L 445 185" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="652.5" y="225.0" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">switch_sel</text>
<rect x="40" y="95" width="280" height="90" rx="10" fill="#e8f1ff" stroke="#9bb4cd"/>
<text x="180" y="131" text-anchor="middle" font-size="18" font-weight="600" fill="#16324f">Input / Ingress Unit</text>
<text x="180" y="159" text-anchor="middle" font-size="14" fill="#40566c">flit 缓冲 · packet 上下文</text>
<rect x="380" y="95" width="280" height="90" rx="10" fill="#e8f1ff" stroke="#9bb4cd"/>
<text x="520" y="131" text-anchor="middle" font-size="18" font-weight="600" fill="#16324f">Switch</text>
<text x="520" y="159" text-anchor="middle" font-size="14" fill="#40566c">按选择转发 · 改写输出 VC</text>
<rect x="720" y="95" width="280" height="90" rx="10" fill="#e8f1ff" stroke="#9bb4cd"/>
<text x="860" y="131" text-anchor="middle" font-size="18" font-weight="600" fill="#16324f">Output / Egress Unit</text>
<text x="860" y="159" text-anchor="middle" font-size="14" fill="#40566c">credit · occupied · flow</text>
<rect x="40" y="285" width="280" height="90" rx="10" fill="#e6f5ee" stroke="#9bb4cd"/>
<text x="180" y="321" text-anchor="middle" font-size="18" font-weight="600" fill="#16324f">RouteComputer</text>
<text x="180" y="349" text-anchor="middle" font-size="14" fill="#40566c">合法输出 VC 候选</text>
<rect x="380" y="285" width="280" height="90" rx="10" fill="#e6f5ee" stroke="#9bb4cd"/>
<text x="520" y="321" text-anchor="middle" font-size="18" font-weight="600" fill="#16324f">VCAllocator</text>
<text x="520" y="349" text-anchor="middle" font-size="14" fill="#40566c">分配 packet 的输出 VC</text>
<rect x="720" y="285" width="280" height="90" rx="10" fill="#e6f5ee" stroke="#9bb4cd"/>
<text x="860" y="321" text-anchor="middle" font-size="18" font-weight="600" fill="#16324f">SwitchAllocator</text>
<text x="860" y="349" text-anchor="middle" font-size="14" fill="#40566c">授予交换机会 · 消耗 credit</text>
<text x="25" y="422" font-size="12" fill="#64748b">Constellation 学习笔记 · 结构示意，非实测波形或物理布局</text>
</g></svg>