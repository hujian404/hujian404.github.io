<text x="690.0" y="371" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">构建</text>
<path d="M 380 352 L 320 352" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350.0" y="371" text-anchor="middle" font-size="12" fill="#40566c" stroke="white" stroke-width="4" paint-order="stroke">观察</text>
