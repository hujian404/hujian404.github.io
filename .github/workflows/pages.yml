name: Sync resume and deploy blog

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update resume from its tracked branch
        shell: bash
        run: |
          git submodule update --init --remote --recursive resume
      - name: Record updated submodule revision
        shell: bash
        run: |
          if ! git diff --quiet -- resume; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add resume
            git commit -m 'chore: sync resume submodule'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: resume
      - name: Assemble static blog
        shell: bash
        run: |
          mkdir -p _site
          git archive HEAD -- '*.html' css fonts images js notes | tar -x -C _site
          # Local reference books must never be published.
          rm -rf _site/notes/booksim-notes/ref
      - name: Build resume at the blog subpath
        working-directory: resume
        env:
          JEKYLL_ENV: production
          BLOG_ORIGIN: ${{ steps.pages.outputs.origin }}
          BLOG_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          ruby -ryaml -e 'File.write(ARGV[0], {"url" => ENV.fetch("BLOG_ORIGIN"), "baseurl" => "#{ENV.fetch("BLOG_BASE_PATH")}/resume"}.to_yaml)' "$RUNNER_TEMP/resume-blog.yml"
          bundle exec jekyll build --strict_front_matter \
            --config "_config.yml,$RUNNER_TEMP/resume-blog.yml" \
            --destination "$GITHUB_WORKSPACE/_site/resume"
          test -s "$GITHUB_WORKSPACE/_site/index.html"
          test -s "$GITHUB_WORKSPACE/_site/resume/index.html"
          test -s "$GITHUB_WORKSPACE/_site/resume/cv/index.html"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
